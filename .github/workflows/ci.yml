name: ci

# Every gate an agent is told to run before reporting done, run again here where
# it cannot be skipped. The contract check comes FIRST and on its own, because a
# frozen-interface edit or a disabled guard makes the rest of the run
# meaningless: the suite would be green and the project would still be broken.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contract guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No install step. The guard has zero dependencies precisely so it still
      # runs when the dependency tree is broken, which is when it matters most.
      - run: node scripts/check-contracts.mjs

  gates:
    name: typecheck, test, build
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: bundle budget
        run: |
          # The whole point of a browser game is that it opens fast. A silent
          # bundle regression is the easiest way to lose that, so name a ceiling.
          # The ceiling is on what a player downloads. Source maps are emitted
          # for debugging and fetched only when devtools are open, so they are
          # measured and reported but not budgeted: counting them made the gate
          # fail at 15MB while the game itself shipped 3MB.
          shipped=$(find dist -type f ! -name '*.map' -exec du -sk {} + | awk '{s+=$1} END {print s+0}')
          maps=$(find dist -name '*.map' -exec du -sk {} + | awk '{s+=$1} END {print s+0}')
          echo "dist ships ${shipped}KB to a player, plus ${maps}KB of source maps"
          if [ "$shipped" -gt 6144 ]; then
            echo "the shipped bundle exceeds the 6MB ceiling. Check what was added, or raise the ceiling deliberately."
            exit 1
          fi

  # WP-23 section 2: the renderer fixtures and the browser playthrough under
  # Chromium's software rasteriser over WebGL2. WebGPU is not exercised here;
  # npm run test:gpu on a Mac stays the WebGPU evidence. The runner appends
  # the results path it used to $GITHUB_OUTPUT, so the upload takes that path
  # rather than a guess at runner.temp, and runs on success and failure.
  browser:
    name: renderer and playthrough (WebGL2, software)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: browser
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: ${{ steps.browser.outputs.results }}
